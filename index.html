<!DOCTYPE html>
<html>

<head>
  <title>Boy_yuskid's Orange Dynasty Space Calendar</title>
  <style>
    body {
      background-color: orange;
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    h1 {
      text-align: center;
      color: white;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background-color: #fff3e0;
    }

    th,
    td {
      border: 2px solid darkorange;
      padding: 10px;
      text-align: center;
    }

    th {
      background-color: darkorange;
      color: white;
    }

    td[contenteditable="true"] {
      background-color: #ffffff;
    }

    .btn {
      margin: 10px 5px;
      padding: 10px 20px;
      background-color: darkorange;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .btn:hover {
      background-color: orangered;
    }
  </style>
</head>

<body>

  <h1>Boy_yuskid's Orange Space Calendar</h1>

  <div id="loginSection" style="text-align: center;">
    <button class="btn" onclick="signIn()">🔐 Login with Google</button>
    <p id="userEmail" style="margin-top: 10px; font-weight: bold;"></p>
  </div>

  <table id="calendarTable">
    <thead>
      <tr>
        <th>Topic</th>
        <th>Host</th>
        <th>Time</th>
        <th>Day</th>
        <th>Re-occurring</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <div style="text-align:center;">
    <button class="btn" onclick="addRow()">+ Add More</button>
    <button class="btn" onclick="saveToFirebase()">💾 Save</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAZbG28EAyuIqt-ydjnFa_wFVX_hELAewQ",
      authDomain: "orange-dynasty-calendar.firebaseapp.com",
      projectId: "orange-dynasty-calendar",
      storageBucket: "orange-dynasty-calendar.appspot.com",
      messagingSenderId: "328655118659",
      appId: "1:328655118659:web:926d731360a0792c728ff6",
      measurementId: "G-L8BC8M227S"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth();
    const provider = new GoogleAuthProvider();
    const allowedEmails = ["adebayosolomon54@gmail.com", "ojoyuskid@gmail.com"];

    let userCanEdit = false;

    const tableBody = document.getElementById("tableBody");
    const userEmailDisplay = document.getElementById("userEmail");

    function addRow(data = ["", "", "", "", ""]) {
      const row = document.createElement("tr");
      data.forEach(cellText => {
        const cell = document.createElement("td");
        if (userCanEdit) cell.contentEditable = true;
        cell.innerText = cellText;
        row.appendChild(cell);
      });
      tableBody.appendChild(row);
    }

    async function saveToFirebase() {
      if (!userCanEdit) {
        alert("❌ You don't have permission to edit.");
        return;
      }

      const rows = [];
      const table = document.getElementById("calendarTable");
      for (let i = 1; i < table.rows.length; i++) {
        const row = table.rows[i];
        const rowData = [];
        for (let j = 0; j < row.cells.length; j++) {
          rowData.push(row.cells[j].innerText.trim());
        }
        rows.push(rowData);
      }

      await setDoc(doc(db, "calendar", "shared"), {
        entries: rows
      });

      alert("✅ Saved to Firebase!");
    }

    function signIn() {
      signInWithPopup(auth, provider).catch(err => {
        console.error("Login failed:", err);
      });
    }

    onAuthStateChanged(auth, user => {
      if (user) {
        const email = user.email;
        userEmailDisplay.textContent = `Logged in as: ${email}`;
        userCanEdit = allowedEmails.includes(email);
        tableBody.innerHTML = "";
      }
    });

    const docRef = doc(db, "calendar", "shared");
    onSnapshot(docRef, (docSnap) => {
      if (docSnap.exists()) {
        tableBody.innerHTML = "";
        const rows = docSnap.data().entries;
        rows.forEach(row => addRow(row));
      } else {
        for (let i = 0; i < 10; i++) addRow();
      }
    });
  </script>

</body>

</html>
