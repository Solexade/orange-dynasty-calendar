<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Orange Dynasty Calendar</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 2rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
    button { margin: 5px; padding: 10px; }
    #userEmail { margin-top: 1rem; font-weight: bold; }
  </style>
</head>
<body>
  <h1>🧡 Orange Dynasty Space Calendar</h1>
  <button onclick="signIn()">🔓 Login with Google</button>
  <button onclick="signOut()">🔒 Logout</button>
  <button onclick="addRow()">➕ Add Row</button>
  <button onclick="saveToFirebase()">💾 Save Changes</button>
  <div id="userEmail">Not logged in</div>
  <table>
    <thead>
      <tr>
        <th>Day</th><th>Date</th><th>Event</th><th>Time</th><th>Notes</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <!-- Firebase Scripts -->
  <script type="module">
    // Import Firebase modules
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";
    import { getAuth, signInWithPopup, signOut, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";

    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyAZbG28EAyuIqt-ydjnFa_wFVX_hELAewQ",
      authDomain: "orange-dynasty-calendar.firebaseapp.com",
      projectId: "orange-dynasty-calendar",
      storageBucket: "orange-dynasty-calendar.appspot.com",
      messagingSenderId: "328655118659",
      appId: "1:328655118659:web:926d731360a0792c728ff6",
      measurementId: "G-L8BC8M227S"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    const allowedEmails = ["adebayosolomon54@gmail.com", "ojoyuskid@gmail.com"];
    let userCanEdit = false;

    const tableBody = document.getElementById("tableBody");
    const userEmailDisplay = document.getElementById("userEmail");

    // Add empty row
    function addRow(data = ["", "", "", "", ""]) {
      const row = document.createElement("tr");
      data.forEach(text => {
        const cell = document.createElement("td");
        cell.textContent = text;
        if (userCanEdit) cell.contentEditable = true;
        row.appendChild(cell);
      });
      tableBody.appendChild(row);
    }

    // Save table content to Firestore
    async function saveToFirebase() {
      if (!userCanEdit) return alert("❌ You don't have permission to edit.");
      const data = [];
      for (let row of tableBody.rows) {
        const rowData = [];
        for (let cell of row.cells) rowData.push(cell.innerText);
        data.push(rowData);
      }
      await setDoc(doc(db, "calendar", "entries"), { data });
      alert("✅ Changes saved.");
    }

    // Load table from Firestore
    async function loadData() {
      const docSnap = await getDoc(doc(db, "calendar", "entries"));
      if (docSnap.exists()) {
        const savedData = docSnap.data().data;
        savedData.forEach(row => addRow(row));
      } else {
        addRow(); // start with an empty row
      }
    }

    // Sign in
    async function signIn() {
      try {
        const result = await signInWithPopup(auth, provider);
        const email = result.user.email;
        userEmailDisplay.textContent = "Logged in as: " + email;
        userCanEdit = allowedEmails.includes(email);
        tableBody.innerHTML = ""; // Clear old rows
        loadData();
      } catch (error) {
        alert("Login failed: " + error.message);
      }
    }

    // Sign out
    function signOutUser() {
      signOut(auth).then(() => {
        userCanEdit = false;
        userEmailDisplay.textContent = "Not logged in";
        tableBody.innerHTML = "";
      });
    }

    window.signIn = signIn;
    window.signOut = signOutUser;
    window.addRow = addRow;
    window.saveToFirebase = saveToFirebase;

    // On page load: check auth state
    onAuthStateChanged(auth, user => {
      if (user) {
        const email = user.email;
        userCanEdit = allowedEmails.includes(email);
        userEmailDisplay.textContent = "Logged in as: " + email;
        loadData();
      }
    });
  </script>
</body>
</html>
