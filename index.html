<!DOCTYPE html>
<html>

<head>
  <title>Boy_yuskid's Orange Dynasty Space Calendar</title>
  <style>
    body {
      background-color: orange;
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    h1 {
      text-align: center;
      color: white;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background-color: #fff3e0;
    }

    th,
    td {
      border: 2px solid darkorange;
      padding: 10px;
      text-align: center;
    }

    th {
      background-color: darkorange;
      color: white;
    }

    td[contenteditable="true"] {
      background-color: #ffffff;
    }

    .btn {
      margin: 10px 5px;
      padding: 10px 20px;
      background-color: darkorange;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .btn:hover {
      background-color: orangered;
    }

    #userEmail {
      color: white;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <h1>Boy_yuskid's Orange Dynasty Space Calendar</h1>

  <div style="text-align:center; margin-bottom: 20px;">
    <button class="btn" onclick="login()">🔐 Login with Google</button>
    <p id="userEmail">Not logged in</p>
  </div>

  <table id="calendarTable">
    <thead>
      <tr>
        <th>Topic</th>
        <th>Host</th>
        <th>Time</th>
        <th>Day</th>
        <th>Re-occurring</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <div style="text-align:center;">
    <button class="btn" onclick="addRow()">+ Add More</button>
    <button class="btn" onclick="saveToFirebase()">💾 Save</button>
  </div>

  <!-- Firebase SDK and Config -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAZbG28EAyuIqt-ydjnFa_wFVX_hELAewQ",
      authDomain: "orange-dynasty-calendar.firebaseapp.com",
      projectId: "orange-dynasty-calendar",
      storageBucket: "orange-dynasty-calendar.appspot.com",
      messagingSenderId: "328655118659",
      appId: "1:328655118659:web:926d731360a0792c728ff6",
      measurementId: "G-L8BC8M227S"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth();
    const provider = new GoogleAuthProvider();

    const allowedEmails = ["adebayosolomon54@gmail.com", "ojoyuskid@gmail.com"];
    let userCanEdit = false;

    const tableBody = document.getElementById("tableBody");
    const userEmailDisplay = document.getElementById("userEmail");

    function addRow(data = ["", "", "", "", ""]) {
      const row = document.createElement("tr");
      data.forEach(cellText => {
        const cell = document.createElement("td");
        if (userCanEdit) cell.contentEditable = true;
        cell.innerText = cellText;
        row.appendChild(cell);
      });
      tableBody.appendChild(row);
    }

    async function loadFromFirebase() {
      const docRef = doc(db, "calendar", "shared");
      const docSnap = await getDoc(docRef);
      if (docSnap.exists()) {
        const rows = docSnap.data().entries;
        rows.forEach(row => addRow(row));
      } else {
        for (let i = 0; i < 10; i++) addRow(); // default blank rows
      }
    }

    async function saveToFirebase() {
      if (!userCanEdit) {
        alert("❌ You don't have permission to edit.");
        return;
      }

      const rows = [];
      const table = document.getElementById("calendarTable");
      for (let i = 1; i < table.rows.length; i++) {
        const row = table.rows[i];
        const rowData = [];
        for (let j = 0; j < row.cells.length; j++) {
          rowData.push(row.cells[j].innerText.trim());
        }
        rows.push(rowData);
      }

      await setDoc(doc(db, "calendar", "shared"), {
        entries: rows
      });

      alert("✅ Saved to Firebase!");
    }

    async function login() {
      try {
        const result = await signInWithPopup(auth, provider);
        const user = result.user;
        userEmailDisplay.innerText = `👤 Logged in as: ${user.email}`;
        userCanEdit = allowedEmails.includes(user.email);

        if (userCanEdit) {
          alert("✅ You have edit access.");
          enableEditing();
        } else {
          alert("🔒 View-only access.");
        }
      } catch (error) {
        console.error("Login error:", error);
        alert("❌ Login failed.");
      }
    }

    function enableEditing() {
      [...tableBody.rows].forEach(row => {
        [...row.cells].forEach(cell => {
          cell.contentEditable = userCanEdit;
        });
      });
    }

    loadFromFirebase();
  </script>

</body>

</html>
