<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Orange Dynasty Calendar</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 20px;
    }

    td,
    th {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: center;
    }

    th {
      background-color: #f2f2f2;
    }

    .buttons {
      margin-bottom: 20px;
    }

    .buttons button {
      margin-right: 10px;
      padding: 8px 16px;
    }
  </style>
</head>

<body>
  <h1>🟠 Orange Dynasty Calendar</h1>
  <div class="buttons">
    <button id="loginBtn">Login with Google</button>
    <button id="logoutBtn" style="display:none;">Logout</button>
    <button onclick="addRow()">Add Row</button>
    <button onclick="saveToFirebase()">💾 Save</button>
  </div>
  <p><strong>Logged in as:</strong> <span id="userEmail">Not logged in</span></p>
  <table>
    <thead>
      <tr>
        <th>Day</th>
        <th>Activity</th>
        <th>Time</th>
        <th>Responsible</th>
        <th>Note</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, getDocs, setDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAZbG28EAyuIqt-ydjnFa_wFVX_hELAewQ",
      authDomain: "orange-dynasty-calendar.firebaseapp.com",
      projectId: "orange-dynasty-calendar",
      storageBucket: "orange-dynasty-calendar.appspot.com",
      messagingSenderId: "328655118659",
      appId: "1:328655118659:web:926d731360a0792c728ff6",
      measurementId: "G-L8BC8M227S"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();
    const allowedEmails = ["adebayosolomon54@gmail.com", "ojoyuskid@gmail.com"];

    let userCanEdit = false;
    const tableBody = document.getElementById("tableBody");
    const userEmailDisplay = document.getElementById("userEmail");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");

    function addRow(data = ["", "", "", "", ""]) {
      const row = document.createElement("tr");
      data.forEach(text => {
        const cell = document.createElement("td");
        if (userCanEdit) cell.contentEditable = true;
        cell.textContent = text;
        row.appendChild(cell);
      });
      tableBody.appendChild(row);
    }

    async function saveToFirebase() {
      if (!userCanEdit) return alert("❌ You don't have permission to save.");
      const rows = [...tableBody.querySelectorAll("tr")];
      const data = rows.map(row => [...row.children].map(td => td.innerText));
      await setDoc(doc(db, "calendar", "main"), { data });
      alert("✅ Saved successfully!");
    }

    async function loadFromFirebase() {
      const snapshot = await getDocs(collection(db, "calendar"));
      snapshot.forEach(docSnap => {
        const savedData = docSnap.data().data || [];
        savedData.forEach(row => addRow(row));
      });
    }

    loginBtn.onclick = () => {
      signInWithPopup(auth, provider)
        .then(result => {
          const user = result.user;
          const email = user.email;
          userEmailDisplay.textContent = email;
          userCanEdit = allowedEmails.includes(email);
          loginBtn.style.display = "none";
          logoutBtn.style.display = "inline";
          tableBody.innerHTML = "";
          loadFromFirebase();
        })
        .catch(error => {
          console.error("Login error:", error);
          alert("Login failed.");
        });
    };

    logoutBtn.onclick = () => {
      signOut(auth).then(() => {
        userEmailDisplay.textContent = "Not logged in";
        loginBtn.style.display = "inline";
        logoutBtn.style.display = "none";
        tableBody.innerHTML = "";
        userCanEdit = false;
      });
    };

    onAuthStateChanged(auth, user => {
      if (user) {
        const email = user.email;
        userEmailDisplay.textContent = email;
        userCanEdit = allowedEmails.includes(email);
        loginBtn.style.display = "none";
        logoutBtn.style.display = "inline";
        loadFromFirebase();
      }
    });
  </script>
</body>

</html>
