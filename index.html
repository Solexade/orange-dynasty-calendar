<!DOCTYPE html>
<html>

<head>
  <title>Boy_yuskid's Orange Dynasty Space Calendar</title>
  <style>
    body {
      background-color: orange;
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    h1 {
      text-align: center;
      color: white;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background-color: #fff3e0;
    }

    th,
    td {
      border: 2px solid darkorange;
      padding: 10px;
      text-align: center;
    }

    th {
      background-color: darkorange;
      color: white;
    }

    td[contenteditable="true"] {
      background-color: #ffffff;
    }

    .btn {
      margin: 10px 5px;
      padding: 10px 20px;
      background-color: darkorange;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .btn:hover {
      background-color: orangered;
    }

    #userInfo {
      text-align: center;
      margin-bottom: 15px;
      color: white;
    }

    #avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      vertical-align: middle;
      margin-left: 10px;
    }
  </style>
</head>

<body>

  <h1>Boy_yuskid's Orange Dynasty Space Calendar</h1>

  <div id="userInfo">
    <button id="loginBtn" class="btn">🔐 Login with Google</button>
    <button id="logoutBtn" class="btn" style="display:none;">🚪 Logout</button>
    <span id="userEmail"></span>
    <img id="avatar" src="" alt="" style="display:none;">
  </div>

  <table id="calendarTable">
    <thead>
      <tr>
        <th>Topic</th>
        <th>Host</th>
        <th>Time</th>
        <th>Day</th>
        <th>Re-occurring</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <div style="text-align:center;">
    <button class="btn" onclick="addRow()">+ Add More</button>
    <button class="btn" onclick="saveToFirebase()">💾 Save</button>
  </div>

  <!-- Firebase Auth SDK -->
  <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js"></script>

  <!-- Firebase Firestore & App SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAZbG28EAyuIqt-ydjnFa_wFVX_hELAewQ",
      authDomain: "orange-dynasty-calendar.firebaseapp.com",
      projectId: "orange-dynasty-calendar",
      storageBucket: "orange-dynasty-calendar.appspot.com",
      messagingSenderId: "328655118659",
      appId: "1:328655118659:web:926d731360a0792c728ff6",
      measurementId: "G-L8BC8M227S"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    const allowedEmails = ["adebayosolomon54@gmail.com", "ojoyuskid@gmail.com"];
    const tableBody = document.getElementById("tableBody");
    let editable = false;

    function addRow(data = ["", "", "", "", ""]) {
      const row = document.createElement("tr");
      data.forEach(cellText => {
        const cell = document.createElement("td");
        cell.contentEditable = editable;
        cell.innerText = cellText;
        row.appendChild(cell);
      });
      tableBody.appendChild(row);
    }

    async function loadFromFirebase() {
      const docRef = doc(db, "calendar", "shared");
      const docSnap = await getDoc(docRef);
      if (docSnap.exists()) {
        const rows = docSnap.data().entries;
        rows.forEach(row => addRow(row));
      } else {
        for (let i = 0; i < 10; i++) addRow();
      }
    }

    async function saveToFirebase() {
      if (!editable) return alert("❌ You don’t have permission to save.");
      const rows = [];
      const table = document.getElementById("calendarTable");
      for (let i = 1; i < table.rows.length; i++) {
        const row = table.rows[i];
        const rowData = [];
        for (let j = 0; j < row.cells.length; j++) {
          rowData.push(row.cells[j].innerText.trim());
        }
        rows.push(rowData);
      }

      await setDoc(doc(db, "calendar", "shared"), { entries: rows });
      alert("✅ Saved to Firebase!");
    }

    // Login and logout
    document.getElementById("loginBtn").onclick = () => {
      signInWithPopup(auth, provider).catch(alert);
    };
    document.getElementById("logoutBtn").onclick = () => {
      signOut(auth).catch(alert);
    };

    // Auth state handler
    onAuthStateChanged(auth, user => {
      const emailSpan = document.getElementById("userEmail");
      const avatar = document.getElementById("avatar");
      const loginBtn = document.getElementById("loginBtn");
      const logoutBtn = document.getElementById("logoutBtn");

      if (user) {
        emailSpan.textContent = user.email;
        avatar.src = user.photoURL;
        avatar.style.display = "inline-block";
        logoutBtn.style.display = "inline-block";
        loginBtn.style.display = "none";

        editable = allowedEmails.includes(user.email);
      } else {
        emailSpan.textContent = "Not logged in";
        avatar.style.display = "none";
        logoutBtn.style.display = "none";
        loginBtn.style.display = "inline-block";
        editable = false;
      }

      // Update table cells based on permission
      document.querySelectorAll("td").forEach(td => {
        td.contentEditable = editable;
      });
    });

    loadFromFirebase();
  </script>

</body>

</html>
